# cargo-deny configuration — the supply-chain gate for the dependency graph.
#
# Run by `.github/workflows/ci.yml` (the `deny` job) on every push and pull
# request, and by `tools/ci-local.ps1` as an optional local step when
# `cargo deny` is installed. `cargo deny check` runs four checks, each with a
# section below:
#
#   advisories — known vulnerabilities (RustSec), unmaintained/yanked crates
#   licenses   — every crate in the graph must be under an allowed license
#   bans       — wildcard version requirements, duplicate versions
#   sources    — only crates.io; no git dependencies from outside the repo
#
# The license allow-list is the complete set of licenses the actual dependency
# graph uses, not a starter list: a new dependency with a new license should be
# a deliberate decision in review, not a CI surprise. `cargo deny list` prints
# the licenses and the crates using each one.
#
# Written against cargo-deny 0.20.x, which is the version
# `EmbarkStudios/cargo-deny-action` (pinned in `ci.yml`) installs.

[graph]
# cargo-deny otherwise considers every crate cargo resolved, including ones that
# only exist for platforms this project never builds (fuchsia, wasm, ...). Those
# links are still checked, but their licenses are irrelevant to the shipped
# binaries, so restrict the graph to the platforms actually built: the CI matrix
# plus both macOS architectures (release.yml ships a universal binary).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# The app has a `backend` feature (on by default) and `--no-default-features` is
# also built and tested; check the union of features so neither configuration of
# the shipped code escapes the checks. The CI action passes --all-features too.
all-features = true

[advisories]
# RustSec advisories. In cargo-deny 0.20 known vulnerabilities, unsound crates
# and yanked versions are handled by dedicated fields; the old
# `vulnerability = "deny"` / `severity-threshold` keys were removed and would
# now be errors themselves.
#
# `unmaintained` defaults to "all", which would fail CI on unmaintained notices
# for transitive crates this project cannot directly replace. "workspace" keeps
# the actionable half: an unmaintained crate we depend on directly fails, while
# a transitive one is still visible in `cargo deny list` / advisory DB without
# turning the gate into a coin flip owned by a dependency's dependency.
unmaintained = "workspace"
# A yanked release is a warning, not a failure: the lockfile pins an exact
# version, so the artifact is still reproducible; a re-lock should pick a live
# version, and `cargo update` in CI would flag it.
yanked = "warn"

[bans]
# A wildcard (`*`) version requirement makes resolution non-reproducible and any
# future major version silently eligible.
wildcards = "deny"

# Path dependencies on sibling workspace crates are declared without a version
# (they are first-party code, not registry crates), which the wildcard lint
# would otherwise flag. This option is exactly for that case. It only applies
# because the four members are marked `publish = false` (application crates,
# never published to crates.io — see each `crates/*/Cargo.toml`): for a
# *publishable* crate cargo-deny rejects this option as inapplicable and the
# wildcard lint still fails, which is the correct behaviour for a library.
allow-wildcard-paths = true

# Duplicate major versions are already tracked per host against a recorded
# baseline by `.github/scripts/check-duplicate-deps.sh`, which exits non-zero on
# regressions. That script stays the source of truth for duplicates (some are
# feature-set splits it knows to ignore); this check surfaces them in the
# supply-chain report without double-gating the same baseline.
multiple-versions = "warn"

[sources]
# Only crates.io is a trusted source. A crate from a git repository or an
# unknown registry has to be a deliberate, reviewed change here first.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
# Every license not listed here is denied. Allow-listed are the SPDX atoms the
# resolved graph actually uses (both permissive and the one weak-copyleft
# exception explained below), plus Apache-2.0, the license of this workspace.
#
# `confidence-threshold` only matters for crates that ship no machine-readable
# `license` field and are classified by scanning their license file; 0.93 keeps
# that classification strict if such a crate is ever added.
confidence-threshold = 0.93
allow = [
    # --- permissive -------------------------------------------------------
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "MIT-0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    # --- weak copyleft ----------------------------------------------------
    # MPL-2.0 is file-level copyleft: it applies to the MPL-covered files
    # themselves, not to code that links against them, so shipping unmodified
    # MPL-2.0 dependencies (the symphonia audio decoders) imposes no obligation
    # on Rift's own source. Accepted deliberately; a stronger copyleft license
    # (GPL/AGPL/LGPL) would still require an exception added here.
    "MPL-2.0",
]
