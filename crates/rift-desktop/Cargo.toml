[package]
name = "rift-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published to crates.io (the app ships as a binary); marking it private
# also lets cargo-deny accept the unversioned path dependencies below (deny.toml).
publish = false
description = "An ad-free YouTube Music player, rendered directly with Vulkan"

# The executable is named `rift-music` (not `rift`) so Discord's automatic game
# detection doesn't mistake the process for the game "RIFT". The library target
# is `rift_desktop`, so the immediate-mode UI and renderer are unit-testable
# without starting a window or a GPU.
[[bin]]
name = "rift-music"
path = "src/main.rs"

[lib]
name = "rift_desktop"
path = "src/lib.rs"

[features]
# The backend is a normal library dependency of the application: the default
# build is the real app (live backend). `--no-default-features` builds the same
# UI with an inert controller, which is useful when only the renderer or the
# immediate-mode framework needs to be compiled/tested (it skips the audio,
# network and platform integration stack).
default = ["backend"]
backend = ["dep:rift"]
# Development-only preview/screenshot support: placeholder data, `--preview`
# and `--screenshot`. Debug builds get it automatically; release builds get it
# ONLY when this feature is enabled explicitly (the local acceptance gate does
# that for its screenshot binary). The shipped release build never enables it,
# so the placeholder data and the dev CLI are absent there. Do not add this to
# `default`.
preview = []

[dependencies]
anyhow = { workspace = true }
# Clipboard backend for the text fields (`ui::clipboard`).
#
# `wayland-data-control` is what makes Ctrl+C/V work under a Wayland session: a
# Wayland-native window is not an X11 client, so arboard's default X11 backend
# sees only the XWayland clipboard, which on KDE does not receive selections
# copied by Wayland apps (the browser a YouTube Music link is copied from, for
# one). With the feature enabled arboard prefers the Wayland data-control
# protocol and falls back to X11 by itself when WAYLAND_DISPLAY is unset or the
# compositor does not implement the protocol (e.g. GNOME/Mutter), so this is
# safe on every desktop. The `wl-clipboard-rs` dependency it pulls in is
# Linux-gated inside arboard, so Windows/macOS builds are unchanged.
arboard = { version = "3", features = ["wayland-data-control"] }
fontdue = "0.9"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rift-types = { path = "../rift-types" }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
vulkano = { version = "0.35.2", default-features = false, features = ["macros"] }
winit = "0.30"
# The backend bridge (enabled by default; see the `backend` feature above).
rift = { path = "../rift", optional = true }

[dev-dependencies]

# Linux-only, test-only: the clipboard tests copy a marker with a real Wayland
# data-control client — the same protocol path a browser uses — to prove the
# app's native clipboard can read a Wayland session's selection. That is exactly
# what arboard's X11-only Linux build could not do (Ctrl+V in the import box
# silently did nothing). The crate is the one arboard's `wayland-data-control`
# feature already pulls in at the same version, so this adds no new package to
# the graph; the test skips itself on sessions without Wayland or data-control.
[target.'cfg(target_os = "linux")'.dev-dependencies]
wl-clipboard-rs = "0.9.5"

# Windows-only, host-gated build dependency for `build.rs`: it runs the Windows
# SDK resource compiler (`rc.exe`) to embed `assets/icons/rift.rc` — the *file*
# icon Explorer, the Start menu and shortcuts read — into `rift-music.exe`.
# Target-specific build dependencies are selected by the *host* platform (a build
# script always runs on the host), so this table is only active when the build is
# started on Windows: the resource compiler does not exist anywhere else, and
# other hosts must not try to run it. A Windows host cross-compiling to
# Linux/macOS still compiles this dependency (verified with
# `cargo build --unit-graph`), but `build.rs` checks the real target
# (`CARGO_CFG_TARGET_OS`) and returns before `rc.exe` runs; only native Windows
# builds embed the resource, and those are the builds CI/release gate.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# A GUI-subsystem binary launched from Explorer has no console, so a startup
# failure (most commonly no Vulkan ICD) would otherwise look like nothing
# happened. `MessageBoxW` gives it a visible, ownership-free error dialog; it is
# target-gated so Linux/macOS builds do not pull in the Windows API tables.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
