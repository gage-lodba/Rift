[package]
name = "rift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published to crates.io (the app ships as a binary); marking it private
# also lets cargo-deny accept the unversioned path dependencies below (deny.toml).
publish = false
description = "An ad-free YouTube Music player — native, framework-agnostic backend library"

# The backend is a plain library: it owns audio, playback, the library store,
# downloads, settings, the ytmusic client, OS media integration and Discord Rich
# Presence, and exposes them through `RiftBackend` plus a channel-based event
# bus. The desktop application (`rift-desktop`, in `crates/rift-desktop/`) is the
# only binary and owns winit/Vulkano and the UI.
[lib]
name = "rift"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
directories = "6"
rand = "0.10.1"
reqwest = { workspace = true }
rift-discord = { path = "../rift-discord" }
rift-types = { path = "../rift-types" }
rift-ytmusic = { path = "../rift-ytmusic" }
rodio = "0.23.0"
serde.workspace = true
serde_json.workspace = true
# OS media-key / now-playing integration: MPRIS (Linux), SMTC (Windows),
# MPNowPlayingInfoCenter (macOS). use_zbus keeps the Linux backend pure-Rust
# (no libdbus); the dbus/zbus deps are Linux-gated inside souvlaki, so this is
# harmless on Windows/macOS.
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tracing = { workspace = true }

# Native file dialogs for playlist import/export. `rfd` replaces the old
# shell's dialog plugin. Dialogs are only opened on the backend's blocking pool
# (never on the UI thread), so the synchronous API is what we use.
#
# The feature split matters: the portal/GTK backends are Linux-only in rfd, and
# leaving the default `async-std` + `xdg-portal` features on would drag a portal
# stack into every platform. On Linux, rfd needs exactly one async backend: the
# app already runs Tokio, so enable `rfd/tokio` (ashpd/zbus then use their Tokio
# backends instead of the unavailable async-io one). Windows/macOS use their
# native backends.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "wayland", "tokio"] }

# rodio's output backend, depended on directly only to enable its Linux
# sound-server host. cpal's default host on Linux is raw ALSA, and ALSA's
# `default` PCM is a hardware card, not the desktop mixer: on a PipeWire or
# PulseAudio session the open either fails with `DeviceBusy` (the server is
# using the card) or, worse, succeeds first and steals a card the server is
# managing (a USB interface's playback device, say). Playback then ignores the
# sink the user configured, and the server's own use of that card starts
# failing. Enabling cpal's `pulseaudio` host makes `default_host()` resolve to
# the running sound server — PipeWire exposes a PulseAudio-compatible one
# (`pipewire-pulse`) — and to raw ALSA only when no server is reachable. The
# host is pure Rust: no libpulse/libpipewire link, no bindgen/libclang, and no
# new system package. The native `pipewire` host is deliberately not enabled;
# it would add a libpipewire runtime link and a libclang build dependency
# without changing where the audio goes. `audio.rs` logs the selected host and
# has a compile-time guard on `rodio::cpal::HostId::PulseAudio`; feature
# unification applies this feature to the cpal instance rodio links, so if the
# two cpal versions ever diverge that guard fails the build instead of silently
# reverting to raw ALSA.
cpal = { version = "0.18.2", features = ["pulseaudio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.16", default-features = false }

[dev-dependencies]
# Used by `examples/probe.rs` to show the fetch pipeline's log output; the app
# crate owns the real subscriber.
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
