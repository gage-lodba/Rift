[package]
name = "rift-ytmusic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published to crates.io (the app ships as a binary); marking it private
# also lets cargo-deny accept the unversioned path dependencies below (deny.toml).
publish = false
description = "Clean-room YouTube Music innertube client for Rift"

[dependencies]
rift-types = { path = "../rift-types" }
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "gzip", "brotli"] }
regex = "1"
thiserror = "2"
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
