# The default permission set granted to Rift's own commands.
#
# `build.rs` declares an app ACL manifest listing every command in
# `src/main.rs`'s `invoke_handler`, which generates an `allow-<command>` and a
# `deny-<command>` permission for each. This grants those.
#
# **The `[default]` table is load-bearing, not a style choice.** Tauri resolves
# the literal identifier `default` by consulting *only*
# `Manifest::default_permission` (`tauri-utils/src/acl/resolved.rs`,
# `get_permissions`): a permission set that happens to be *named* `default`
# lands in `Manifest::permission_sets`, which that branch never looks at, so
# `"default"` in a capability resolves to **zero** permissions. It does not
# error — it grants nothing, and every app command is then rejected at runtime
# with "command not allowed". This file was written as `[[set]] identifier =
# "default"` at first and did exactly that.
#
# Keep this in step with `build.rs`. `tauri-build` validates that every name
# here exists, so a typo fails the build; it cannot know whether a *command* is
# missing, so a forgotten entry fails at runtime instead. The test
# `src-tauri/tests/acl_covers_commands.rs` closes that gap by resolving the
# generated ACL and asserting every registered command is allowed.
#
# There is deliberately no `deny-*` entry: the generated per-command deny
# permissions exist for scoped capabilities, and listing one here would make the
# corresponding command permanently unreachable.
[default]
description = "Everything Rift's webview needs; see build.rs for the command list."
permissions = [
  "allow-search",
  "allow-search-artists",
  "allow-search-albums",
  "allow-get-artist",
  "allow-get-artist-songs",
  "allow-get-album",

  "allow-play-tracks",
  "allow-play-track",
  "allow-toggle-play",
  "allow-next-track",
  "allow-prev-track",
  "allow-seek",
  "allow-set-volume",
  "allow-save-volume",
  "allow-set-discord-rpc",
  "allow-set-crossfade",
  "allow-toggle-shuffle",
  "allow-cycle-repeat",

  "allow-queue-add",
  "allow-queue-play-next",
  "allow-queue-move",
  "allow-queue-remove",
  "allow-queue-jump",
  "allow-queue-clear",

  "allow-toggle-like",
  "allow-create-playlist",
  "allow-import-yt-playlist",
  "allow-export-playlist",
  "allow-import-playlist",
  "allow-delete-playlist",
  "allow-rename-playlist",
  "allow-move-playlist",
  "allow-add-to-playlist",
  "allow-remove-from-playlist",
  "allow-bootstrap",

  "allow-download-tracks",
  "allow-remove-downloads",

  "allow-check-ytdlp",
  "allow-set-yt-dlp-path",
  "allow-download-ytdlp",

  "allow-check-update",
  "allow-set-update-notifications",
  "allow-open-url",

  "allow-window-minimize",
  "allow-window-toggle-maximize",
  "allow-window-close",
]
