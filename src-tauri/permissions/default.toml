# The default permission set granted to Rift's own commands.
#
# `build.rs` declares an app ACL manifest listing every command in
# `src/main.rs`'s `invoke_handler`, which generates an `allow-<command>` and a
# `deny-<command>` permission for each. This set is the one `capabilities/
# default.json` grants, so a command has to be listed here *and* in `build.rs`
# to be callable from the webview.
#
# Keep this in step with `build.rs`. `tauri-build` validates capability
# permission names, so a typo fails the build; it does not know whether a
# command is missing from this list, so a *forgotten* entry fails at runtime
# instead — as an "app command not allowed" rejection from the IPC layer.
#
# Note there is deliberately no `deny-*` entry: the autogenerated per-command
# deny permissions exist for scoped capabilities, and listing one here would
# make the corresponding command permanently unreachable.
[[set]]
identifier = "default"
description = "Everything Rift's webview needs; see build.rs for the command list."
permissions = [
  "allow-search",
  "allow-search-artists",
  "allow-search-albums",
  "allow-get-artist",
  "allow-get-artist-songs",
  "allow-get-album",

  "allow-play-tracks",
  "allow-play-track",
  "allow-toggle-play",
  "allow-next-track",
  "allow-prev-track",
  "allow-seek",
  "allow-set-volume",
  "allow-save-volume",
  "allow-set-discord-rpc",
  "allow-set-crossfade",
  "allow-toggle-shuffle",
  "allow-cycle-repeat",

  "allow-queue-add",
  "allow-queue-play-next",
  "allow-queue-move",
  "allow-queue-remove",
  "allow-queue-jump",
  "allow-queue-clear",

  "allow-toggle-like",
  "allow-create-playlist",
  "allow-import-yt-playlist",
  "allow-export-playlist",
  "allow-import-playlist",
  "allow-delete-playlist",
  "allow-rename-playlist",
  "allow-move-playlist",
  "allow-add-to-playlist",
  "allow-remove-from-playlist",
  "allow-bootstrap",

  "allow-download-tracks",
  "allow-remove-downloads",

  "allow-check-ytdlp",
  "allow-set-yt-dlp-path",
  "allow-download-ytdlp",

  "allow-check-update",
  "allow-set-update-notifications",
  "allow-open-url",

  "allow-window-minimize",
  "allow-window-toggle-maximize",
  "allow-window-close",
]
