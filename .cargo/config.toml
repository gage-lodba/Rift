# Frontend test harness (see ui/README.md).
#
# `cargo test` on wasm32 produces a `.wasm` module, which Cargo then tries to
# exec directly — on every platform that fails with "not a valid Win32
# application" / "Exec format error". `wasm-bindgen-test-runner` is the missing
# half: it generates the JS glue for the test binary and runs it under Node.
#
# Scoped to the wasm32 target so native builds are untouched, and it only fires
# when Cargo *executes* an artifact, i.e. `cargo test`. `trunk build`, the
# wasm clippy pass, and `cargo test --workspace --exclude rift-ui` never invoke
# it.
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"

# The DOM the renderer tests mount into.
#
# `wasm-bindgen-test-runner` builds a Node script and runs it, and offers no hook
# of its own for injecting globals — but `NODE_OPTIONS=--require <file>` is
# evaluated by Node *before* the script, which is exactly early enough: `web-sys`
# resolves `window` and `document` lazily, so they only have to exist before the
# first component mounts. `ui/tests/dom-shim.cjs` installs them.
#
# `relative = true` resolves the path against *this file's* directory rather than
# the working directory, so it is correct whether Cargo is invoked from the repo
# root or from `ui/`, on every platform. `force` is deliberately left unset, so a
# `NODE_OPTIONS` you set yourself wins (Cargo warns that it is skipping this one)
# rather than being silently replaced.
#
# Only the wasm32 test run needs it. `trunk build`, the wasm clippy pass, and
# every native build are unaffected — though `cargo build`, which reads this
# table too, will also carry the variable. That is inert: `--require` only means
# anything to Node.
[env]
NODE_OPTIONS = { value = "--require ui/tests/dom-shim.cjs", relative = true }
