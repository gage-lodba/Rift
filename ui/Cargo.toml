[package]
name = "rift-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rift-types = { path = "../types" }
serde.workspace = true
serde_json.workspace = true
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "HtmlInputElement", "HtmlSelectElement", "Navigator", "DragEvent", "DataTransfer", "Element", "HtmlElement", "HtmlImageElement", "DomRect", "Window", "Storage", "Document", "Node", "NodeList"] }
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
# Test-only, and only for the wasm target: this is the harness that lets the
# frontend's real logic (the IPC call path, the reorder index math) be driven
# without a running app. It is NOT a runtime dependency — `trunk build` and the
# shipped wasm never link it.
#
# Version-coupled to `wasm-bindgen` above: the CLI that runs these tests
# (`wasm-bindgen-test-runner`) refuses a test binary whose `wasm-bindgen` does
# not match its own version exactly, so CI installs
# `wasm-bindgen-cli@<the version Cargo.lock pins>` — see ui/README.md.
wasm-bindgen-test = "0.3"
# Yew's server renderer, for the component tests. It drives the real component
# renderer with no DOM at all, so a component can be rendered under the plain
# Node runner — see src/tests/components.rs.
#
# Declared here rather than as a feature of the `yew` dependency so the shipped
# bundle never links it. Cargo unifies this into the main `yew` dependency for
# test builds only, which was measured rather than assumed: `trunk build` with
# this line, without it, and with it again produced a byte-identical wasm every
# time (5129.9 KB, sha256 CA2BCE547562DFBC…), and neither crate the `ssr`
# feature adds appears in the non-test dependency tree at all.
#
# Note the same `version = "0.21"` requirement as the dependency above is what
# lets the features unify. Raising one without the other would silently split
# Yew into two crates and the renderer would stop being the one the app uses.
#
# `csr` is already on through the main dependency, so this would unify anyway;
# it is listed so the feature the *tests* need is stated where the tests'
# dependencies are, rather than only implied by the line above.
yew = { version = "0.21", features = ["ssr", "csr"] }
