[workspace]
resolver = "2"
members = ["types", "ui", "src-tauri", "crates/ytmusic"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
