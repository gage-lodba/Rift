name: Release

# Build native (`cargo build --release`) binaries and attach them to a GitHub
# Release when a version tag is pushed (e.g. `git tag v0.6.0 && git push origin
# v0.6.0`).
#
# Packaging/installers are out of scope: the assets are plain executables, one
# per platform. (The old shell's bundler is gone, so there is nothing to bundle.)
#
# `workflow_dispatch` allows a manual run for testing the build; that path only
# creates/updates a *draft*, so a test run can't be mistaken for a release — and
# it refuses to touch a published release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# `gh release` needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: plain x86_64 binary, built on the older Ubuntu image. The
          # binary links the system Vulkan loader and ALSA only.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/rift-music
            asset: rift-music-linux-x86_64
          # macOS: one universal (Intel + Apple Silicon) binary, built on the
          # Apple Silicon runner. Avoids the retired/scarce Intel `macos-13`
          # runner, which can leave its job queued indefinitely. Pinned to
          # `macos-15` (Xcode 16 / clang 16): `macos-latest` has rolled to
          # macOS 26 / Xcode 26.5, whose clang 21 linker segfaults building some
          # host proc-macro dylibs.
          #
          # Rust has no `universal-apple-darwin` target (and this repo has no
          # `.cargo/config.toml` alias), so the job builds both slices below and
          # `lipo`s them together; `universal: true` selects those steps and
          # `target` is only the rust-cache key label.
          - platform: macos-15
            target: macos-universal
            universal: true
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            asset: rift-music-macos-universal
          # Windows: plain x86_64 executable.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/rift-music.exe
            asset: rift-music-windows-x86_64.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag names the artifacts and is what `check_update` compares against
      # the running version, so a tag that disagrees with the workspace version
      # both mislabels every asset and makes the app report a phantom update
      # forever (it would see `v1.0.0` while running 0.6.0, and never reach it).
      # `app` and `backend` inherit `version.workspace = true`, so Cargo.toml is
      # the single source of the version.
      - name: Verify the tag matches the workspace version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag  Cargo.toml workspace version=$declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag v$tag does not match Cargo.toml workspace version ($declared)"
            exit 1
          fi

      # Native build dependencies (see ci.yml for the rationale): ALSA is the
      # only hard link dependency on Linux; winit's X11/Wayland backends are
      # compiled against these development packages and dlopen the libraries at
      # runtime; Vulkan is loaded at runtime.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libvulkan-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          # Pinned and mirrored in rust-toolchain.toml: the released binaries
          # should be built by a known compiler, not by whatever `stable` is that
          # week. Without an explicit `toolchain` this action installs the latter.
          toolchain: 1.88.0
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Keep per-platform (and per-target) caches separate.
          key: ${{ matrix.platform }}-${{ matrix.target }}

      # Linux/Windows: one target, one binary (no behaviour change).
      - name: Build (release)
        if: ${{ !matrix.universal }}
        run: cargo build --release -p rift-desktop --locked --target ${{ matrix.target }}

      # macOS: both slices. The runner is Apple Silicon, so the aarch64 build is
      # native and the x86_64 one is an ordinary cross-compile; the toolchain
      # action installed both targets above.
      - name: Build (release, Apple Silicon)
        if: ${{ matrix.universal }}
        run: cargo build --release -p rift-desktop --locked --target aarch64-apple-darwin

      - name: Build (release, Intel)
        if: ${{ matrix.universal }}
        run: cargo build --release -p rift-desktop --locked --target x86_64-apple-darwin

      # One Mach-O containing both architectures, published under the same asset
      # name as before. `lipo -info` is the proof it contains both slices.
      - name: Create the universal binary (lipo)
        if: ${{ matrix.universal }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          lipo -create \
            -output "release-assets/${{ matrix.asset }}" \
            target/aarch64-apple-darwin/release/rift-music \
            target/x86_64-apple-darwin/release/rift-music
          lipo -info "release-assets/${{ matrix.asset }}"

      - name: Stage the binary
        if: ${{ !matrix.universal }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "${{ matrix.binary }}" "release-assets/${{ matrix.asset }}"

      # CI checks the icon on its own release-profile build, but this workflow
      # uploads a *separately built* binary — check the exact artifact that is
      # about to be published, not just a same-commit sibling. The failure mode
      # is silent otherwise: Explorer/Start menu/shortcuts read the icon from the
      # PE resource without starting the app, so a missing resource only shows up
      # as Windows' generic application icon after release.
      - name: Executable carries the Windows app icon resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/check-windows-icon.ps1 -Path "release-assets/${{ matrix.asset }}"

      # The release assets are built with the default features, so preview mode
      # and its placeholder data must not be present. A shipped executable that
      # accepts the development-only flag would mean the feature leaked into the
      # release build.
      - name: Shipped binary rejects development-only preview flags
        shell: bash
        run: |
          set +e
          asset="release-assets/${{ matrix.asset }}"
          chmod +x "$asset" 2>/dev/null || true
          output=$("$asset" --preview 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::the shipped release binary accepted --preview"
            exit 1
          fi
          case "$output" in
            *development-only*) ;;
            *)
              echo "::error::unexpected rejection message from the shipped binary"
              exit 1
              ;;
          esac

      # `gh` is preinstalled on the hosted runners and uses GITHUB_TOKEN, so this
      # needs no third-party release action. The three matrix jobs share one
      # release and run concurrently: creating is retried, and the upload retries
      # briefly in case a sibling job is still creating the release.
      - name: Publish to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
            draft="false"
          else
            declared=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            release_tag="v${declared}"
            draft="true"
          fi

          notes="Rift ${release_tag} — native Vulkan build. Download the executable for your platform from the assets below. Rift needs an up-to-date Vulkan-capable GPU driver; audio is resolved and streamed natively (no external downloader). Installers/packaging are out of scope for this conversion: run the binary directly."

          # A manual run must never modify a published release (that path exists
          # only to test the build). It creates or updates a draft instead.
          if gh release view "$release_tag" >/dev/null 2>&1; then
            if [ "$draft" = "true" ]; then
              is_draft=$(gh release view "$release_tag" --json isDraft --jq '.isDraft')
              if [ "$is_draft" != "true" ]; then
                echo "::error::refusing to upload a manual-run build to the published release $release_tag"
                exit 1
              fi
            fi
          else
            if [ "$draft" = "true" ]; then
              gh release create "$release_tag" --draft --title "Rift $release_tag" --notes "$notes" || true
            else
              gh release create "$release_tag" --title "Rift $release_tag" --notes "$notes" || true
            fi
          fi

          asset="release-assets/${{ matrix.asset }}"
          for attempt in 1 2 3 4 5; do
            if gh release upload "$release_tag" "$asset" --clobber; then
              echo "uploaded $asset to $release_tag"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::could not upload $asset to $release_tag"
          exit 1
