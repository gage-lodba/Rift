name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap and platform-independent, so it runs before anything that compiles.
  toolchain:
    name: toolchain version is consistent
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `rust-version` in Cargo.toml, the channel in rust-toolchain.toml, and the
      # `toolchain:` inputs below all state the same version, and they are not
      # redundant — see the script's header. Fails if they disagree, so the
      # declared minimum cannot quietly stop being what anything is built with.
      # `shell: bash` is stated rather than inherited. The scripts carry a bash
      # shebang and are committed executable, so Linux and macOS would run them
      # from the default shell either way — but the Windows runner's default shell
      # is pwsh, where a bare `.sh` path is resolved by file association rather
      # than by the shebang. Stating the shell makes all three platforms run the
      # script the way its header documents, and is what makes the executable bit
      # sufficient instead of load-bearing.
      - name: Check toolchain consistency
        shell: bash
        run: .github/scripts/check-toolchain-consistency.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-22.04
    steps:
      # Actions are pinned to a commit SHA, with the version in a comment: a tag
      # is mutable, so `@v5` is a moving target that can be repointed at
      # arbitrary code without this file changing. Dependabot understands the
      # comment form and will keep the SHAs current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          # The declared MSRV. Every job builds at the floor on purpose: that is
          # what makes `rust-version` a fact rather than a claim, and why the pin
          # is 1.88 instead of whatever happened to be installed.
          toolchain: 1.88.0
          components: rustfmt
      # `--all` covers every workspace member under `crates/`. The whole
      # application is built by cargo, so there is no separate frontend
      # formatter to run, and no `.cargo/config.toml` runner wiring is needed.
      - run: cargo fmt --all --check

  build:
    name: clippy, test & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 (not macos-latest): macos-latest has rolled to macOS 26 /
        # Xcode 26.5, whose clang 21 linker segfaults building some host
        # dylibs for proc-macros. macos-15 is the known-good released image.
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Native build dependencies. The app is winit + Vulkano + rodio:
      #   * ALSA (rodio/cpal) is the only hard link dependency on Linux;
      #   * Vulkan itself is loaded at runtime (ash's `loaded` feature) and the
      #     CI jobs never open a swapchain, but the loader/headers are cheap to
      #     have so a future headless-render test doesn't need a workflow edit;
      #   * X11/Wayland/xkbcommon development packages are what winit's backends
      #     are compiled against (they are dlopen'd at runtime).
      # macOS and Windows ship the needed audio/Vulkan/X11 equivalents.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libvulkan-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          # The declared MSRV. Everything below runs at the floor on purpose:
          # that is what makes `rust-version` a fact rather than a claim, and it
          # is why the pin in rust-toolchain.toml is 1.88 rather than whatever
          # happened to be installed.
          toolchain: 1.88.0
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Explicit package list rather than `--workspace`: it documents exactly the
      # crates the native application is built from (the workspace members are
      # the five crates under `crates/`).
      - name: Clippy
        run: cargo clippy -p rift -p rift-types -p rift-ytmusic -p rift-discord -p rift-desktop --all-targets --locked -- -D warnings

      # The four library crates opt into `#![warn(missing_docs)]`; deny rustdoc
      # warnings so doc coverage cannot regress silently. rift-desktop is an
      # internal app crate and is deliberately excluded (see README conventions).
      - name: Docs (library crates, warnings denied)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p rift -p rift-types -p rift-ytmusic -p rift-discord --no-deps --locked

      - name: Test
        run: cargo test -p rift -p rift-types -p rift-ytmusic -p rift-discord -p rift-desktop --locked

      # The README promises a UI-only build (`--no-default-features`) for
      # renderer/immediate-mode work. Compile and test that configuration so it
      # cannot rot: it drops the whole backend dependency stack.
      - name: Test (UI-only, no default features)
        run: cargo test -p rift-desktop --no-default-features --locked

      # Two major versions of the same crate in one binary means duplicated
      # types, two TLS stacks, and a bigger install for no reason. The script
      # narrows `cargo tree -d` to genuinely distinct versions (it also reports
      # one version split across feature sets) and compares against the
      # recorded baseline, because `cargo tree -d` exits 0 either way. The
      # baseline is per host: `cargo tree` filters by the host target, so the
      # duplicated set genuinely differs across this matrix.
      - name: Check for duplicate dependency versions
        shell: bash
        run: .github/scripts/check-duplicate-deps.sh

      # Compile the shipped artifact in the release profile (lto,
      # codegen-units=1, symbols stripped) on every OS: the debug profiled jobs
      # above would not catch a release-only linker/codegen failure, and that is
      # only otherwise exercised on a tag push. No packaging step: the conversion
      # ships a plain binary (see release.yml).
      - name: Build the app (release)
        run: cargo build --release -p rift-desktop --locked

      # The executable's file icon is a Windows PE resource (RT_GROUP_ICON plus
      # its RT_ICON images), not something the program can decide at runtime:
      # Explorer, the Start menu, shortcuts and taskbar pinning read it out of
      # the file without ever starting the app. The runtime window icon set by
      # `main.rs::window_icon()` is a different thing and cannot substitute for
      # it. The native rewrite replaced the previous shell's build step with a
      # plain `cargo build`, silently dropped the embedded icon once, and
      # nothing failed — the app built and ran, and only Explorer showed the
      # generic Windows application icon. `.github/scripts/check-windows-icon.ps1`
      # parses the PE resource directory itself (no SDK tooling, so it cannot be
      # skipped by a runner without a developer prompt) and fails this step if
      # the icon resource is absent.
      - name: Executable carries the Windows app icon resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/check-windows-icon.ps1 -Path target/release/rift-music.exe

      # The shipped release binary must not contain the development-only preview
      # mode / placeholder data. The dev flags are compiled out unless the
      # non-default `preview` feature is enabled; invoking one must fail fast at
      # argument parsing before any window/GPU/backend work.
      - name: Shipped release rejects development-only preview flags
        shell: bash
        run: |
          set +e
          bin="target/release/rift-music"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          output=$("$bin" --preview 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::the shipped release binary accepted --preview"
            exit 1
          fi
          case "$output" in
            *development-only*) ;;
            *)
              echo "::error::unexpected rejection message from the shipped binary"
              exit 1
              ;;
          esac

  # Supply-chain gate. This is independent of the build matrix (one cheap Docker
  # action, no application compile), so it is its own job: a vulnerability or a
  # new/denied license should fail review quickly instead of waiting for three
  # OS builds. It reads `deny.toml` from the checkout, which carries the policy
  # and the license allow-list for the actual dependency graph.
  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA-pinned like every other action here; `v2` in the comment is what
      # Dependabot tracks. The action is a Docker image with cargo-deny 0.20.x
      # baked in — there is no separate Rust-install step, and the version is
      # deliberately the one `deny.toml` was validated against. The image's
      # entrypoint runs `rustup show` in the checkout before `cargo deny`, so the
      # repository's `rust-toolchain.toml` pin (1.88.0) supplies the toolchain
      # here too. `--locked` matters: the check must run against the committed
      # dependency graph, not a resolution it might silently update while reading
      # metadata.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features --locked
