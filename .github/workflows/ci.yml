name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap and platform-independent, so it runs before anything that compiles.
  toolchain:
    name: toolchain version is consistent
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # `rust-version` in Cargo.toml, the channel in rust-toolchain.toml, and the
      # `toolchain:` inputs below all state the same version, and they are not
      # redundant — see the script's header. Fails if they disagree, so the
      # declared minimum cannot quietly stop being what anything is built with.
      # `shell: bash` is stated rather than inherited. The scripts carry a bash
      # shebang and are committed executable, so Linux and macOS would run them
      # from the default shell either way — but the Windows runner's default shell
      # is pwsh, where a bare `.sh` path is resolved by file association rather
      # than by the shebang. Stating the shell makes all three platforms run the
      # script the way its header documents, and is what makes the executable bit
      # sufficient instead of load-bearing.
      - name: Check toolchain consistency
        shell: bash
        run: .github/scripts/check-toolchain-consistency.sh
      # The test runner refuses a wasm test binary built against a different
      # `wasm-bindgen` than its own, and `wasm-bindgen` is a transitive
      # dependency Dependabot will bump on its own. Checked here rather than in
      # the frontend job because it is a comparison of two files, and belongs
      # before anything compiles.
      - name: Check wasm-bindgen version consistency
        shell: bash
        run: .github/scripts/check-wasm-bindgen-version.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-22.04
    steps:
      # Actions are pinned to a commit SHA, with the version in a comment: a tag
      # is mutable, so `@v5` is a moving target that can be repointed at
      # arbitrary code without this file changing. Dependabot understands the
      # comment form and will keep the SHAs current.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          # The declared MSRV. Every job builds at the floor on purpose: that is
          # what makes `rust-version` a fact rather than a claim, and why the pin
          # is 1.88 instead of whatever happened to be installed.
          toolchain: 1.88.0
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    name: clippy, test & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 (not macos-latest): macos-latest has rolled to macOS 26 /
        # Xcode 26.5, whose clang 21 linker segfaults building the
        # proc-macro-error-attr host dylib (pulled in transitively by yew).
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Tauri v2's Linux build dependencies (note: webkit2gtk 4.1, not 4.0).
      # macOS and Windows ship the needed webview + audio backends already.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          # The declared MSRV. Everything below runs at the floor on purpose:
          # that is what makes `rust-version` a fact rather than a claim, and it
          # is why the pin in rust-toolchain.toml is 1.88 rather than whatever
          # happened to be installed.
          toolchain: 1.88.0
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      # Prebuilt trunk binary via taiki-e/install-action (a composite action, so
      # no deprecated Node runtime); pinned to a specific trunk version.
      - name: Install trunk
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: trunk@0.21.14

      # The runner that executes the frontend's wasm test binaries. Must be the
      # exact version Cargo.lock resolves for `wasm-bindgen` (checked by the
      # `toolchain` job above): it rejects a test binary built against any other.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: wasm-bindgen-cli@0.2.128

      # `cargo tauri build --no-bundle` further down is a cargo *subcommand*:
      # cargo resolves it to a `cargo-tauri` binary on PATH (or beside cargo
      # itself), and nothing else here provides one — the hosted runners do not
      # ship it, and it is not a dependency of this workspace (`tauri-cli`
      # appears in no manifest and in no Cargo.lock). Without this step that
      # build stops at its first line with "no such command: tauri" (exit 101)
      # before compiling anything.
      #
      # A developer machine hides exactly that: a previous `cargo install
      # tauri-cli` leaves `cargo-tauri` in ~/.cargo/bin, so the same command
      # succeeds locally and fails here.
      #
      # `tauri-cli` is not one of install-action's managed tools, so this goes
      # through its cargo-binstall fallback, which reads the binstall metadata
      # the crate publishes (`cargo-tauri-<target>.tgz`/`.zip` attached to the
      # `tauri-cli-v<version>` release) and, where no archive matches the
      # runner's target — aarch64-apple-darwin, i.e. macos-15 — falls back to
      # compiling it. Pinned to the `tauri` version Cargo.lock resolves, so the
      # CLI driving the build is the one the app is linked against.
      - name: Install tauri-cli
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: tauri-cli@2.11.5

      # The DOM the frontend's renderer tests mount into. A Node-side dependency
      # of the *test harness only* — `trunk build` never runs Node, and nothing
      # here reaches the wasm or the shipped bundle (ui/package.json says so).
      #
      # `npm ci` rather than `npm install` so the lockfile decides, which is the
      # same reason Cargo.lock is committed and `--locked` is used everywhere
      # else in this file. Every OS installs it: the suite below runs on all
      # three, so all three need the DOM.
      - name: Install the frontend test harness's DOM
        working-directory: ui
        run: npm ci

      # A one-second check that the shim can do the one thing the renderer tests
      # need, before anything compiles. Its two failure modes are a jsdom that
      # cannot load and a shim that loads without installing the globals — and
      # both otherwise surface as a `web-sys` panic that names a missing global
      # rather than this file. Worth its second on every OS: the value that
      # loads the shim lives in `.cargo/config.toml`'s `[env]` table, and if it
      # is ever written in a form Cargo rewrites the shim silently stops loading
      # (that file records the trap).
      - name: Check the DOM shim
        working-directory: ui
        run: node scripts/check-dom-shim.cjs

      # Build the WASM frontend. This also populates ../dist, which the Tauri
      # backend embeds via generate_context! when it compiles below.
      - name: Build frontend
        working-directory: ui
        run: trunk build

      - name: Clippy (frontend / wasm)
        run: cargo clippy -p rift-ui --target wasm32-unknown-unknown --locked -- -D warnings

      # The frontend's tests, run on Node via wasm-bindgen-test-runner (wired up
      # by the runner entry and the `[env]` table in .cargo/config.toml). They
      # cover the IPC boundary's argument shapes, the reorder index math, App's
      # pure decisions, and the renderer itself through the DOM shim — not
      # computed style, which needs a layout engine; see ui/README.md for what is
      # deliberately outside this harness.
      #
      # Runs on all three operating systems, and that is the point: the DOM shim,
      # the `NODE_OPTIONS` value that loads it, and the renderer tests are now
      # exercised on every platform instead of on two of three. It could not
      # always. `wasm-bindgen-test-runner` 0.2.128 writes the benchmark path into
      # the generated Node script with `Path::display()` inside a *single-quoted*
      # JS string, so on Windows it emitted `'C:\Users\...'` and Node rejected the
      # file while parsing it — `\ui`, the package directory, is an invalid
      # escape; `\U` is not (JS accepts it as a NonEscapeCharacter, exactly as it
      # accepts `\Users`). `.cargo/config.toml` sidesteps it by pinning
      # `WASM_BINDGEN_BENCH_RESULT` to a relative path, which keeps the literal
      # free of backslashes. The upstream defect is real and unfixed there.
      - name: Test (frontend / wasm)
        run: cargo test -p rift-ui --target wasm32-unknown-unknown --locked

      - name: Clippy (backend)
        run: cargo clippy --workspace --exclude rift-ui --all-targets --locked -- -D warnings

      - name: Test (backend)
        run: cargo test --workspace --exclude rift-ui --locked

      # Two major versions of the same crate in one binary means duplicated
      # types, two TLS stacks, and a bigger install for no reason. The script
      # narrows `cargo tree -d` to genuinely distinct versions (it also reports
      # one version split across feature sets) and compares against the
      # recorded baseline, because `cargo tree -d` exits 0 either way. The
      # baseline is per host: `cargo tree` filters by the host target, so the
      # duplicated set genuinely differs across this matrix — the Windows
      # `windows-*` generation, macOS's Cocoa/Swift crates, and the Linux-only
      # zbus 3 tree — and each platform is checked against its own list.
      - name: Check for duplicate dependency versions
        shell: bash
        run: .github/scripts/check-duplicate-deps.sh

      # Compile the packaged artifact. Clippy already links the crate, so a
      # broken tauri.conf.json is caught there — but the release profile
      # (lto/codegen-units) and the bundle inputs the *linker* does not read
      # (icons, mainBinaryName, NSIS/WiX prerequisites) are otherwise exercised
      # only on a tag push, which surfaces a malformed icon or a bad
      # `targets: "all"` at release time on the wrong commit. `--no-bundle`
      # keeps it to a compile, so no packaging toolchain is needed — but the
      # CLI itself is, and is installed above.
      - name: Build the app (no bundle)
        working-directory: src-tauri
        run: cargo tauri build --no-bundle
